[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "config-cascade-merge"
version = "0.9.0"
description = "A small, schema-driven YAML object merger and validator"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE.txt"]
authors = [
    { name = "149segolte" },
]
keywords = ["configuration", "merge", "schema", "validation", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
config-cascade-merge = "config_cascade_merge.cli:main"

[project.urls]
Issues = "https://github.com/149segolte/config-cascade-merge/issues"
Repository = "https://github.com/149segolte/config-cascade-merge"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/LICENSE.txt",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/config_cascade_merge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
