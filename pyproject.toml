[project]
name = "config-merger"
version = "0.5.0"
license = "MPL-2.0"
description = "A small, schema-driven YAML object merger and validator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
